# Azulejo Brutalism Light for WezTerm. Copy to ~/.config/wezterm/colors/

[metadata]
name = "Azulejo Brutalism Light"

[colors]
foreground = "#0C1030"
background = "#F3F0E8"

cursor_bg = "#D49A1A"
cursor_fg = "#0C1030"
cursor_border = "#D49A1A"
compose_cursor = "#1E2A9E"

selection_fg = "#0C1030"
selection_bg = "#9FB2E4"

scrollbar_thumb = "#5A5E78"
split = "#0C1030"

ansi = [ "#0C1030", "#B03A2E", "#2F6B3A", "#8F6200", "#1E2A9E", "#6B2E80", "#1D6E7E", "#D8D4C8" ]
brights = [ "#5A5E78", "#C8513F", "#3E8A4C", "#B07A0C", "#3A48C4", "#8A48A0", "#2A8C9E", "#E8E4D9" ]

copy_mode_active_highlight_fg = { Color = "#0C1030" }
copy_mode_active_highlight_bg = { Color = "#D49A1A" }
copy_mode_inactive_highlight_fg = { Color = "#0C1030" }
copy_mode_inactive_highlight_bg = { Color = "#D6DAE7" }
quick_select_label_fg = { Color = "#0C1030" }
quick_select_label_bg = { Color = "#D49A1A" }
quick_select_match_fg = { Color = "#0C1030" }
quick_select_match_bg = { Color = "#D6DAE7" }

[colors.tab_bar]
background = "#E8E4D9"
inactive_tab_edge = "#0C1030"

[colors.tab_bar.active_tab]
bg_color = "#1E2A9E"
fg_color = "#F3F0E8"
intensity = "Bold"

[colors.tab_bar.inactive_tab]
bg_color = "#E8E4D9"
fg_color = "#5A5E78"

[colors.tab_bar.inactive_tab_hover]
bg_color = "#D6DAE7"
fg_color = "#0C1030"

[colors.tab_bar.new_tab]
bg_color = "#E8E4D9"
fg_color = "#5A5E78"

[colors.tab_bar.new_tab_hover]
bg_color = "#D6DAE7"
fg_color = "#0C1030"
